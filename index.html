<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<title>Familieplan</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Ikoner for hjemskjerm. Ingen familiedata på denne siden – den sender bare videre til appen. -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=3">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Familieplan">
<meta name="theme-color" content="#121317">
<script>
  // Appens /exec-adresse (krever Google-innlogging og at man står på familielista).
  var APP = 'https://script.google.com/macros/s/AKfycbzeDhxII9cAWmNEVeas3YVApwWKVVFAXtN-6Jas1AXqYI-B2bormoaeaouzkx_FK4rx/exec';
  // Bare når siden er åpnet fra hjemskjermen som nettapp, går vi rett til appen.
  // I vanlig Safari blir siden stående, slik at den kan legges til på hjemskjermen.
  var fraHjem = navigator.standalone === true ||
    (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if (fraHjem) { location.replace(APP); }
</script>
<style>
  html,body{margin:0;min-height:100%;background:#121317;color:#eceef3;font-family:-apple-system,Roboto,sans-serif}
  .c{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;box-sizing:border-box;text-align:center}
  img{width:120px;height:120px;border-radius:27px}
  h1{margin:0;font-size:24px}
  .steg{background:#1c1e24;border-radius:16px;padding:16px 18px;max-width:340px;text-align:left;line-height:1.5;font-size:15px}
  .steg b{color:#ffb36b}
  a.knapp{display:inline-block;margin-top:4px;padding:14px 26px;border-radius:14px;background:linear-gradient(135deg,#ffb36b,#ff8a3d);color:#121317;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="c">
  <img src="icon-512.png?v=3" alt="Familieplan-logo">
  <h1>Familieplan</h1>
  <div class="steg">
    <b>iPhone:</b> Trykk på Del-knappen nederst i Safari og velg «Legg til på Hjem-skjerm».<br>
    <b>Android:</b> Trykk på ⋮ i Chrome og velg «Legg til på startskjermen».
  </div>
  <a class="knapp" id="lenke" href="#">Åpne Familieplan</a>
</div>
<script>document.getElementById('lenke').href = APP;</script>
</body>
</html>
